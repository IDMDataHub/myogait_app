[server]
# Matches Settings.max_upload_mb and nginx client_max_body_size.
# A 2 GB upload is buffered server-side; see deploy/nginx-location.conf.
maxUploadSize = 2048
maxMessageSize = 2048
enableXsrfProtection = true
headless = true

[browser]
gatherUsageStats = false

[theme]
# Bauhaus / 1960s German postmodern print identity -- see
# myogait_app/branding.py for the full rationale and the validated hex
# values this mirrors, and myogait_app/theme_css.py for the injected CSS
# that expresses everything this config block cannot (heavy rules, the
# numbered-section signature, the colour-block metric strip). Keep the
# three files in sync when any changes. Light-only, deliberately: this
# print language is inherently light-ground, so there is no [theme.dark]
# section for a dark OS preference to pick up a half-finished world from.
#
# A parallel dark "Nocturne" identity was explored on this same surface
# (see CHANGELOG.md, v0.3.0) and this block previously carried it; product
# direction landed back on this paper world -- see DESIGN.md's
# "Reconciled with Nocturne" section for the reasoning.
base = "light"
primaryColor = "#c21b16"
backgroundColor = "#edeae3"
secondaryBackgroundColor = "#e3dfd6"
textColor = "#111213"
linkColor = "#7f4c00"
borderColor = "#b9b6ac"
showWidgetBorder = true
baseRadius = "none"
buttonRadius = "none"
font = "Helvetica Neue, Helvetica, Arial, sans-serif"
headingFont = "Helvetica Neue, Helvetica, Arial, sans-serif"
codeFont = "JetBrains Mono, ui-monospace, monospace"

[runner]
fastReruns = true
