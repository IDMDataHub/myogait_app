[server]
# Matches Settings.max_upload_mb and nginx client_max_body_size.
# A 2 GB upload is buffered server-side; see deploy/nginx-location.conf.
maxUploadSize = 2048
maxMessageSize = 2048
enableXsrfProtection = true
headless = true

[browser]
gatherUsageStats = false

[theme]
# Bauhaus / ~1960s international-typographic-style identity -- see
# myogait_app/branding.py for the full rationale and the validated hex
# values these mirror. Keep the two files in sync when either changes;
# branding.py is the source of truth for anything Plotly-rendered, this
# file for Streamlit's own chrome. Light-only, deliberately: Bauhaus
# print is inherently a light-ground medium, and only one world (the
# paper-toned one below) was ever art-directed -- no [theme.dark]
# section, so there is nothing here for a dark OS preference to pick up
# a half-finished counterpart from. baseRadius/buttonRadius stay "none"
# for the sharp geometric edges this world runs on throughout.
base = "light"
baseRadius = "none"
buttonRadius = "none"
primaryColor = "#e0a80f"
backgroundColor = "#e8e8e2"
secondaryBackgroundColor = "#dedcd4"
textColor = "#16181a"
borderColor = "#b9b6ac"
# Bright yellow primaryColor reads fine on Streamlit's own filled widget
# chrome (buttons, sliders, checkboxes), but as plain link text directly
# on the paper background it fails contrast (1.75:1, needs 3:1) -- see
# branding.py's accent_mark. linkColor uses that darker value instead.
linkColor = "#7f4c00"
font = "Helvetica Neue, Helvetica, Arial, sans-serif"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"

[theme.sidebar]
backgroundColor = "#dedcd4"
borderColor = "#b9b6ac"

[runner]
fastReruns = true
