[server]
# Matches Settings.max_upload_mb and nginx client_max_body_size.
# A 2 GB upload is buffered server-side; see deploy/nginx-location.conf.
maxUploadSize = 2048
maxMessageSize = 2048
enableXsrfProtection = true
headless = true

[browser]
gatherUsageStats = false

[theme]
# "Nocturne" identity -- a dark, Bauhaus/1960s-international dark ground with
# a single blurple accent voice and Inter throughout. Design-system tokens
# live in the source-of-truth palette; branding.py mirrors these for anything
# Plotly-rendered, this file drives Streamlit's own chrome. Keep the two in
# sync. Dark-only, by design: the system was art-directed on the dark ground.
base = "dark"
baseRadius = "medium"
buttonRadius = "medium"
primaryColor = "#9184d9"
backgroundColor = "#161826"
secondaryBackgroundColor = "#232532"
textColor = "#e9e9ed"
borderColor = "#3f424d"
# Accent-400: readable as plain link text on the dark ground (the primary
# blurple is reserved for filled/outlined widget chrome).
linkColor = "#b5abfc"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"

[theme.sidebar]
backgroundColor = "#1b1d29"
secondaryBackgroundColor = "#232532"
borderColor = "#3f424d"

[runner]
fastReruns = true
