name: Dependency audit

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: constraints-study-linux-py312.txt
      - run: python -m pip install --upgrade pip pip-audit
      - run: pip-audit --requirement constraints-study-linux-py312.txt
