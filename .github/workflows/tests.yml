name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - name: Install the application and test tools
        run: python -m pip install -r requirements-dev.txt -e .
      - name: Lint
        run: ruff check myogait_app tests
      - name: Test with a coverage floor
        run: pytest -q --cov=myogait_app --cov-report=term-missing --cov-fail-under=60
