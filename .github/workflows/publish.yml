name: Build & Publish

# Build the distribution on every push and pull request so packaging
# breakage is caught early; publish to PyPI only when a version tag is
# pushed (e.g. v0.1.0), via PyPI Trusted Publishing (OIDC) -- no token
# stored in the repository.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - name: Verify the installed wheel
        run: |
          python -m venv /tmp/myogait-app-venv
          /tmp/myogait-app-venv/bin/pip install dist/*.whl
          /tmp/myogait-app-venv/bin/python -c "import myogait_app; print('myogait-app', myogait_app.__version__)"
          /tmp/myogait-app-venv/bin/myogait-app --help
          /tmp/myogait-app-venv/bin/pip check

      - name: Smoke-test pages with the installed runtime
        run: |
          /tmp/myogait-app-venv/bin/pip install pytest
          PYTHONPATH=. /tmp/myogait-app-venv/bin/pytest -q \
            tests/test_smoke_pages.py tests/test_pages_with_data.py tests/test_cohort_smoke.py

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Only on a version tag.
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/project/myogait-app/
    permissions:
      id-token: write   # OIDC token for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
