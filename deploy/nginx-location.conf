# app myogait -- nginx location block
#
# Modelled on the existing physioevalab-emg-streamlit deployment.
# The one thing that differs: uploads are up to 2 GB, so both the body
# size limit and the timeouts have to be raised. Leaving
# client_max_body_size at its 1 MB default makes every video upload fail
# with a 413 before Streamlit ever sees it.

location /apps/app-myogait/ {
    proxy_pass http://127.0.0.1:8502/apps/app-myogait/;
    proxy_http_version 1.1;

    # WebSocket upgrade -- Streamlit will not run without it.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 2 GB video uploads.
    client_max_body_size 2048m;
    client_body_timeout 3600s;
    proxy_request_buffering off;

    # Long-lived session socket; extractions run for a long time.
    proxy_read_timeout 86400;
    proxy_send_timeout 86400;
}
